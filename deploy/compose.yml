# SportsArc beta stack: the same file runs on a laptop and on the VPS.
#
#   laptop:  deploy/local.sh up          (http://localhost:8080)
#   VPS:     /opt/sportsarc/deploy.sh deploy <tag>
#
# Everything is configured from .env next to this file (see .env.beta.example).
# Profiles, chosen with COMPOSE_PROFILES in .env:
#   db             bundled Postgres; leave it out when DATABASE_URL points at a
#                  managed database
#   observability  Grafana + Loki + Alloy + Prometheus (logs, dashboards, alerts)
#   tunnel         Cloudflare quick tunnel: a public https URL for phone testing
#   s3             copy backups to an S3-compatible bucket (off by default)
#
# Networks: `private` is internal (no route out); `public` has egress for the
# app (Circle, RPCs, Brevo), Grafana (Telegram), the S3 copy and the tunnel.
# Only Caddy publishes ports; Grafana is bound to the host's loopback.
#
# The dev database in the repo root's compose.yml is a separate project.

name: ${COMPOSE_PROJECT_NAME:-sportsarc-beta}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# One definition for every app container. A deploy restarts them one at a
# time, so each is its own service. To add app3, copy the app2 block (see
# deploy/README.md) and add it to APP_UPSTREAMS.
x-app: &app
  image: ${APP_IMAGE:-sportsarc}:${APP_TAG:-local}
  init: true
  restart: unless-stopped
  env_file: .env
  environment: &app-env
    # production unless .env says otherwise (local without a Brevo key only).
    NODE_ENV: ${NODE_ENV:-production}
    PORT: "3000"
    # On SIGTERM the app reports /health/ready 503 at once, keeps serving for
    # SHUTDOWN_DRAIN_DELAY_MS so Caddy's active check (every 3s) takes it out
    # of the pool, then closes its listener and drains; the whole shutdown is
    # capped at SHUTDOWN_TIMEOUT_MS (the delay counts toward it).
    SHUTDOWN_DRAIN_DELAY_MS: ${SHUTDOWN_DRAIN_DELAY_MS:-5000}
    SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-20000}
    DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-sportsarc}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sportsarc}}
  # Longer than SHUTDOWN_TIMEOUT_MS, so Docker never SIGKILLs a draining app.
  stop_grace_period: 30s
  read_only: true
  tmpfs:
    - /tmp:size=64m
  volumes:
    # Photos stay on local disk; every app container mounts the same volume.
    - uploads:/app/data/uploads
  networks: [public, private]
  depends_on:
    migrate:
      condition: service_completed_successfully
      required: false
  # Liveness (/health). Readiness (/health/ready) is Caddy's check and
  # deploy.sh's; using it here would mark every draining container unhealthy.
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 60s
    start_interval: 2s
  deploy:
    resources:
      limits:
        memory: ${APP_MEMORY:-384m}
  logging: *logging

services:
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
      APP_UPSTREAMS: ${APP_UPSTREAMS:-app1:3000 app2:3000}
      HEALTH_PATH: ${HEALTH_PATH:-/health/ready}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [public, private]
    deploy:
      resources:
        limits:
          memory: 128m
    logging: *logging

  app1:
    <<: *app

  app2:
    <<: *app

  # One-off: `docker compose run --rm migrate`. `up` also runs it before the
  # app containers start. It is `pnpm migration:up` without --env-file.
  migrate:
    image: ${APP_IMAGE:-sportsarc}:${APP_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
      # Only behind a TLS-intercepting proxy: EXTRA_CA_FILE=/path/ca.pem and
      # usually BUILD_NETWORK=host. Both are no-ops by default.
      network: ${BUILD_NETWORK:-default}
      secrets: [extra_ca]
    restart: "no"
    env_file: .env
    environment: *app-env
    command: ["node", "--import=tsx", "node_modules/@mikro-orm/cli/cli.js", "migration:up", "--config", "./mikro-orm.config.ts"]
    networks: [public, private]
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    deploy:
      resources:
        limits:
          memory: 384m
    logging: *logging

  postgres:
    image: postgres:16
    profiles: [db]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sportsarc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sportsarc}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60"]
    shm_size: 128m
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *logging

  # Nightly pg_dump into ./backups (7 daily + 4 weekly kept). Stock postgres
  # image (pg_dump must match the database major), script mounted read-only.
  # Also: docker compose run --rm backup now | list | restore <file> --yes
  backup:
    image: postgres:16
    restart: unless-stopped
    entrypoint: ["bash", "/opt/backup/backup.sh"]
    command: ["daemon"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-sportsarc}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sportsarc}}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
    volumes:
      - ./backup/backup.sh:/opt/backup/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    networks: [private]
    deploy:
      resources:
        limits:
          memory: 128m
    logging: *logging

  # ── s3 profile (off by default) ─────────────────────────────────────
  # Mirrors ./backups to an S3-compatible bucket every hour.
  backup-s3:
    image: amazon/aws-cli:2.31.0
    profiles: [s3]
    restart: unless-stopped
    entrypoint: ["bash", "/opt/backup/s3-sync.sh"]
    environment:
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-sportsarc}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_SYNC_INTERVAL_MIN: ${S3_SYNC_INTERVAL_MIN:-60}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - ./backup/s3-sync.sh:/opt/backup/s3-sync.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups:ro
    networks: [public]
    deploy:
      resources:
        limits:
          memory: 192m
    logging: *logging

  # ── tunnel profile ──────────────────────────────────────────────────
  # A Cloudflare quick tunnel: no account, no domain. The https URL is new on
  # every start; `deploy/local.sh url` prints it.
  tunnel:
    image: cloudflare/cloudflared:2025.9.1
    profiles: [tunnel]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://caddy:80"]
    networks: [public]
    depends_on: [caddy]
    deploy:
      resources:
        limits:
          memory: 64m
    logging: *logging

  # ── observability profile ───────────────────────────────────────────
  loki:
    image: grafana/loki:3.5.5
    profiles: [observability]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks: [private]
    deploy:
      resources:
        limits:
          memory: 384m
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.6.0
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [private]
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *logging

  # Reads every container's logs through the Docker socket, host metrics and
  # Caddy's metrics; ships logs to Loki and metrics to Prometheus. The host
  # mounts give disk/memory figures on Linux (on a Mac they describe the
  # Docker VM).
  alloy:
    image: grafana/alloy:v1.11.0
    profiles: [observability]
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-sportsarc-beta}
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/sys:ro
    networks: [private]
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *logging

  # Container lifecycle as log lines (start, die with exit code, oom,
  # health_status) for the restart and health alerts.
  events:
    image: docker:29-cli
    profiles: [observability]
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - >-
        exec docker events --filter "label=com.docker.compose.project=$$PROJECT" --filter type=container
        --filter event=start --filter event=die --filter event=oom --filter event=health_status
        --format '{"event":"{{.Action}}","svc":"{{index .Actor.Attributes "com.docker.compose.service"}}","container":"{{index .Actor.Attributes "name"}}","exitCode":"{{index .Actor.Attributes "exitCode"}}"}'
    environment:
      PROJECT: ${COMPOSE_PROJECT_NAME:-sportsarc-beta}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    network_mode: none
    deploy:
      resources:
        limits:
          memory: 32m
    logging: *logging

  grafana:
    image: grafana/grafana:12.2.0
    profiles: [observability]
    restart: unless-stopped
    entrypoint: ["sh", "/etc/sportsarc/start.sh"]
    ports:
      # Loopback only. On the VPS reach it with: ssh -L 3001:127.0.0.1:3001 deploy@<vps>
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      # Alert delivery; start.sh writes the contact point from these.
      ALERT_CHANNEL: ${ALERT_CHANNEL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-}
    volumes:
      - ./observability/grafana/start.sh:/etc/sportsarc/start.sh:ro
      - ./observability/grafana/provisioning:/etc/sportsarc/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [public, private]
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *logging

secrets:
  extra_ca:
    file: ${EXTRA_CA_FILE:-/dev/null}

networks:
  public:
  private:
    internal: true

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
  loki_data:
  prometheus_data:
  alloy_data:
  grafana_data:
