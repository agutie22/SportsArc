# Loki (logs) and Prometheus (metrics), both on the private network.
# The fixed uids are what the dashboards and alert rules refer to.
apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000
      # Click-through from a log line to every line of the same request.
      # Caddy logs the request ID as "uuid", the app as "reqId", and a
      # browser error report names the failed API call as "failedReqId".
      derivedFields:
        - name: request
          matcherType: regex
          matcherRegex: '"(?:reqId|uuid)":"([A-Za-z0-9._:-]{8,128})"'
          url: '{service=~".+"} |= "$${__value.raw}"'
          datasourceUid: loki
          urlDisplayLabel: All lines of this request
        - name: failed request
          matcherType: regex
          matcherRegex: '"failedReqId":"([A-Za-z0-9._:-]{8,128})"'
          url: '{service=~"app[0-9]+"} |= "$${__value.raw}" | json | reqId="$${__value.raw}"'
          datasourceUid: loki
          urlDisplayLabel: Server lines of the failed call
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: 30s
