# Alert rules for the beta stack (generated as JSON-compatible YAML).
# Thresholds are in the C (threshold) step of each rule; edit here, then
# docker compose restart grafana. Delivery: see ../../start.sh.
{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "sportsarc",
      "folder": "SportsArc",
      "interval": "1m",
      "rules": [
        {
          "uid": "sa-server-errors",
          "title": "Server errors",
          "condition": "C",
          "for": "1m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "More than 5 server errors in 5 minutes",
            "description": "Dashboard > Server errors; open a line and follow 'All lines of this request' (reqId). Explore: {service=~\"app[0-9]+\", source=\"server\", level=\"error\"}"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "loki",
              "model": {
                "refId": "A",
                "expr": "sum(count_over_time({service=~\"app[0-9]+\", source=\"server\", level=\"error\"}[5m]))",
                "instant": true,
                "range": false,
                "queryType": "instant"
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        5
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "sa-job-failures",
          "title": "Background job failing",
          "condition": "C",
          "for": "0s",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "Background job {{ $labels.source }} is failing",
            "description": "Job lines at error, or a tick that caught its own error (warn, 'tick failed'), in the last 15 minutes. Explore: {source=\"{{ $labels.source }}\"}"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "loki",
              "model": {
                "refId": "A",
                "expr": "sum by (source) (count_over_time({service=~\"app[0-9]+\", source=~\"job:.+\", level=~\"error|warn\"} | json msg=\"msg\" | __error__=\"\" | level=\"error\" or msg=~\".*tick failed.*\" [15m]))",
                "instant": true,
                "range": false,
                "queryType": "instant"
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "sa-client-errors",
          "title": "Browser errors",
          "condition": "C",
          "for": "0s",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "More than 20 browser error reports in 15 minutes",
            "description": "Reports from frontend/errors.js (at most 5 per page load). Dashboard > Browser errors; a report's failedReqId links to the server lines of the failed call."
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "loki",
              "model": {
                "refId": "A",
                "expr": "sum(count_over_time({service=~\"app[0-9]+\", source=\"client\", level=\"error\"}[15m]))",
                "instant": true,
                "range": false,
                "queryType": "instant"
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        20
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "sa-app-5xx",
          "title": "App 5xx responses",
          "condition": "C",
          "for": "0s",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "5 or more 5xx responses from the app in 5 minutes",
            "description": "From the access lines. Dashboard > 5xx by route (app access lines)."
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "loki",
              "model": {
                "refId": "A",
                "expr": "sum(count_over_time({service=~\"app[0-9]+\"} | json kind=\"kind\", status=\"status\" | __error__=\"\" | kind=\"access\" | status >= 500 [5m]))",
                "instant": true,
                "range": false,
                "queryType": "instant"
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        4
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "sa-unstructured-errors",
          "title": "Unstructured app errors",
          "condition": "C",
          "for": "2m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "More than 5 plain-text error lines from the app in 5 minutes",
            "description": "Lines that are not JSON: app stderr (e.g. a crash trace before the logger is up) or an app running with LOG_FORMAT=pretty."
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "loki",
              "model": {
                "refId": "A",
                "expr": "sum(count_over_time({service=~\"app[0-9]+\", level=\"error\", source=\"\"}[5m]))",
                "instant": true,
                "range": false,
                "queryType": "instant"
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        5
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "sa-5xx-rate",
          "title": "Edge 5xx above 5%",
          "condition": "C",
          "for": "2m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "More than 5% of requests failed with a 5xx in the last 5 minutes",
            "description": "From Caddy, so it also covers 502/503 when no app container answers. At least 5 errors and over 5% of traffic."
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "(sum(rate(caddy_http_request_duration_seconds_count{handler!=\"metrics\",code=~\"5..\"}[5m])) / clamp_min(sum(rate(caddy_http_request_duration_seconds_count{handler!=\"metrics\"}[5m])), 1e-9)) and on() (sum(increase(caddy_http_request_duration_seconds_count{handler!=\"metrics\",code=~\"5..\"}[5m])) >= 5)",
                "instant": true,
                "range": false
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0.05
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "sa-health-check",
          "title": "App container failing health checks",
          "condition": "C",
          "for": "1m",
          "noDataState": "Alerting",
          "execErrState": "Error",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "Caddy marks an app container unhealthy",
            "description": "One app container has failed its health check for over a minute; Caddy has taken it out of the pool. If both are down the site is down. Check: docker compose ps, and the app logs."
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "min(caddy_reverse_proxy_upstreams_healthy)",
                "instant": true,
                "range": false
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        1
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "sa-container-unhealthy",
          "title": "Docker health check failing",
          "condition": "C",
          "for": "0s",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "A container reported unhealthy",
            "description": "Docker's own health check failed for a container (see Container events on the dashboard)."
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "loki",
              "model": {
                "refId": "A",
                "expr": "sum(count_over_time({service=\"events\"} |= \"health_status: unhealthy\" [10m]))",
                "instant": true,
                "range": false,
                "queryType": "instant"
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "sa-container-restart",
          "title": "Container crashed or restarting",
          "condition": "C",
          "for": "0s",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "A container exited with an error or was OOM-killed",
            "description": "A container died with a non-zero exit code (a deploy's stop exits 0 or 143 and does not count) or ran out of memory. Docker restarts it; repeated alerts mean a crash loop. See Container events and the container's logs."
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "loki",
              "model": {
                "refId": "A",
                "expr": "sum(count_over_time({service=\"events\"} | json | event=~\"die|oom\" | exitCode!~\"0|143\" [10m]))",
                "instant": true,
                "range": false,
                "queryType": "instant"
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "sa-disk-full",
          "title": "Disk nearly full",
          "condition": "C",
          "for": "10m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "A disk is more than 85% full",
            "description": "Postgres, backups, uploads and logs share the disk. Free space: docker system prune (old images), fewer kept backups, or a bigger disk."
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "max(1 - node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay\"})",
                "instant": true,
                "range": false
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0.85
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "sa-backup-failed",
          "title": "Database backup failed",
          "condition": "C",
          "for": "0s",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "The nightly database backup failed",
            "description": "See: docker compose logs backup. Run one by hand with: docker compose run --rm backup now"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 93600,
                "to": 0
              },
              "datasourceUid": "loki",
              "model": {
                "refId": "A",
                "expr": "sum(count_over_time({service=\"backup\"} |= \"level=error\" [26h]))",
                "instant": true,
                "range": false,
                "queryType": "instant"
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ]
        }
      ]
    }
  ]
}
