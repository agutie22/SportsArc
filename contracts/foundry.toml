[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# 0.8.28, not the 0.8.20 on the x402 branches: the contracts here are ^0.8.28.
# X402Pool.sol is ^0.8.20, so it still compiles when those branches merge.
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Referenced by name: `forge script --rpc-url arc_testnet`.
[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
