name: sportsarc

services:
  postgres:
    image: postgres:16-alpine
    container_name: sportsarc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sportsarc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportsarc}
      POSTGRES_DB: ${POSTGRES_DB:-sportsarc}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sportsarc} -d ${POSTGRES_DB:-sportsarc}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
