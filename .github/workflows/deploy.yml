# Deploy the beta: after CI passes on a push to main, build the image, push
# it to GHCR as ghcr.io/<owner>/sportsarc:<commit sha> and :beta, then SSH to
# the VPS, refresh the stack files in /opt/sportsarc and run
# `deploy.sh deploy <sha>` (migrate, then a rolling restart; a failure leaves
# the old version serving and fails this job).
#
# Run it by hand (Actions > Deploy > Run workflow) to redeploy main, or give
# a tag (an earlier commit sha) to put that image back.
#
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (private key whose public half
# bootstrap-vps.sh authorized), VPS_SSH_KNOWN_HOSTS (the server's host key
# line, pinned; unknown hosts are refused). GHCR uses GITHUB_TOKEN.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (a commit sha already in GHCR). Empty: build and deploy the chosen branch."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

# One deploy at a time; a newer one waits instead of cancelling a running one.
concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - id: meta
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          sha="${RUN_SHA:-$GITHUB_SHA}"
          tag="${INPUT_TAG:-$sha}"
          if ! printf '%s' "$tag" | grep -qE '^[A-Za-z0-9_.-]{1,128}$'; then echo "bad tag: $tag"; exit 1; fi
          {
            echo "image=ghcr.io/${OWNER,,}/sportsarc"
            echo "tag=$tag"
            echo "sha=$sha"
            echo "build=$([ -z "$INPUT_TAG" ] && echo yes || echo no)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.meta.outputs.build == 'yes'
        with:
          ref: ${{ steps.meta.outputs.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        if: steps.meta.outputs.build == 'yes'
      - uses: docker/build-push-action@v6
        if: steps.meta.outputs.build == 'yes'
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:beta
          build-args: GIT_SHA=${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: the tag exists in GHCR
        env:
          REF: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
        run: docker buildx imagetools inspect "$REF" > /dev/null

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: beta
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - name: SSH setup (pinned host key)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          for v in VPS_SSH_KEY VPS_SSH_KNOWN_HOSTS VPS_HOST VPS_USER; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set (deploy/README.md)"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
          CFG
          ssh vps true
      - name: Refresh the stack files in /opt/sportsarc
        run: |
          tar -C deploy -czf - compose.yml Caddyfile deploy.sh .env.beta.example backup observability \
            | ssh vps 'tar -xzf - -C /opt/sportsarc && chmod 755 /opt/sportsarc/deploy.sh'
      - name: deploy.sh deploy
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The job token logs the VPS in to GHCR for this pull only; it
          # expires with the job and is removed again afterwards. IMAGE and
          # TAG are checked in the build job and expand here on purpose.
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '$GHCR_USER' --password-stdin > /dev/null \
            && APP_IMAGE='$IMAGE' /opt/sportsarc/deploy.sh deploy '$TAG'; rc=\$?; docker logout ghcr.io > /dev/null; exit \$rc"
      - name: Status
        if: always()
        run: ssh vps '/opt/sportsarc/deploy.sh status; /opt/sportsarc/deploy.sh history' || true
